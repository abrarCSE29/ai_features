<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Object Detection Visualization</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #eee;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #00d4ff;
            font-size: 2.5rem;
            text-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
        }

        .upload-section {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #00d4ff;
            font-weight: 600;
        }

        input[type="file"] {
            display: none;
        }

        .file-upload-btn {
            display: inline-block;
            padding: 12px 30px;
            background: linear-gradient(135deg, #00d4ff 0%, #0099cc 100%);
            color: #1a1a2e;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .file-upload-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 212, 255, 0.4);
        }

        .file-name {
            margin-left: 15px;
            color: #aaa;
        }

        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid rgba(0, 212, 255, 0.3);
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus, input[type="number"]:focus {
            outline: none;
            border-color: #00d4ff;
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.3);
        }

        .threshold-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        input[type="range"] {
            flex: 1;
            height: 8px;
            -webkit-appearance: none;
            background: rgba(0, 212, 255, 0.2);
            border-radius: 5px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            background: #00d4ff;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
        }

        .threshold-value {
            min-width: 60px;
            text-align: center;
            font-weight: 600;
            color: #00d4ff;
        }

        .detect-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #00d4ff 0%, #0099cc 100%);
            border: none;
            border-radius: 10px;
            color: #1a1a2e;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .detect-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.4);
        }

        .detect-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .results-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        @media (max-width: 768px) {
            .results-section {
                grid-template-columns: 1fr;
            }
        }

        .result-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 25px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .result-card h2 {
            color: #00d4ff;
            margin-bottom: 20px;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .result-card h2::before {
            content: '';
            width: 4px;
            height: 25px;
            background: #00d4ff;
            border-radius: 2px;
        }

        .image-container {
            width: 100%;
            border-radius: 10px;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.3);
            min-height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .image-container img {
            max-width: 100%;
            max-height: 500px;
            object-fit: contain;
        }

        .placeholder-text {
            color: #666;
            font-size: 1.1rem;
        }

        .detection-stats {
            display: grid;
            gap: 15px;
        }

        .stat-item {
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid rgba(0, 212, 255, 0.2);
            border-radius: 10px;
            padding: 15px;
            transition: all 0.3s ease;
        }

        .stat-item:hover {
            background: rgba(0, 212, 255, 0.15);
            transform: translateX(5px);
        }

        .stat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .stat-name {
            font-weight: 600;
            color: #fff;
            text-transform: capitalize;
        }

        .stat-count {
            background: #00d4ff;
            color: #1a1a2e;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.9rem;
        }

        .stat-count.zero {
            background: #666;
        }

        .boxes-list {
            font-size: 0.85rem;
            color: #aaa;
            font-family: 'Courier New', monospace;
        }

        .box-coord {
            background: rgba(0, 0, 0, 0.3);
            padding: 5px 10px;
            border-radius: 5px;
            margin: 5px 0;
            display: inline-block;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 40px;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(0, 212, 255, 0.3);
            border-top-color: #00d4ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error-message {
            background: rgba(255, 71, 87, 0.2);
            border: 1px solid rgba(255, 71, 87, 0.5);
            color: #ff4757;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
        }

        .error-message.active {
            display: block;
        }

        .success-message {
            background: rgba(46, 213, 115, 0.2);
            border: 1px solid rgba(46, 213, 115, 0.5);
            color: #2ed573;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
        }

        .success-message.active {
            display: block;
        }

        .preview-image {
            max-width: 200px;
            max-height: 200px;
            border-radius: 10px;
            margin-top: 15px;
            display: none;
        }

        .preview-image.active {
            display: block;
        }

        .hint {
            font-size: 0.85rem;
            color: #888;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Object Detection</h1>
        
        <div class="upload-section">
            <div class="form-group">
                <label for="imageInput">Upload Image</label>
                <label class="file-upload-btn" for="imageInput">Choose File</label>
                <span class="file-name" id="fileName">No file selected</span>
                <input type="file" id="imageInput" accept="image/*">
                <img id="previewImage" class="preview-image" alt="Preview">
            </div>

            <div class="form-group">
                <label for="objectNames">Object Names to Detect</label>
                <input type="text" id="objectNames" placeholder="e.g., person, car, dog, cat">
                <p class="hint">Enter comma-separated object names (e.g., person, car, dog)</p>
            </div>

            <div class="form-group">
                <label for="threshold">Confidence Threshold</label>
                <div class="threshold-container">
                    <input type="range" id="threshold" min="0" max="1" step="0.05" value="0.25">
                    <span class="threshold-value" id="thresholdValue">0.25</span>
                </div>
            </div>

            <button class="detect-btn" id="detectBtn" disabled>Detect Objects</button>
            
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Processing image...</p>
            </div>
            
            <div class="error-message" id="errorMessage"></div>
            <div class="success-message" id="successMessage"></div>
        </div>

        <div class="results-section" id="resultsSection" style="display: none;">
            <div class="result-card">
                <h2>Annotated Image</h2>
                <div class="image-container" id="annotatedImageContainer">
                    <span class="placeholder-text">Annotated image will appear here</span>
                </div>
            </div>

            <div class="result-card">
                <h2>Detection Results</h2>
                <div class="detection-stats" id="detectionStats">
                    <span class="placeholder-text">Detection statistics will appear here</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const imageInput = document.getElementById('imageInput');
        const fileName = document.getElementById('fileName');
        const previewImage = document.getElementById('previewImage');
        const objectNames = document.getElementById('objectNames');
        const threshold = document.getElementById('threshold');
        const thresholdValue = document.getElementById('thresholdValue');
        const detectBtn = document.getElementById('detectBtn');
        const loading = document.getElementById('loading');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');
        const resultsSection = document.getElementById('resultsSection');
        const annotatedImageContainer = document.getElementById('annotatedImageContainer');
        const detectionStats = document.getElementById('detectionStats');

        // Update threshold value display
        threshold.addEventListener('input', () => {
            thresholdValue.textContent = threshold.value;
        });

        // Handle file selection
        imageInput.addEventListener('change', () => {
            const file = imageInput.files[0];
            if (file) {
                fileName.textContent = file.name;
                
                // Show preview
                const reader = new FileReader();
                reader.onload = (e) => {
                    previewImage.src = e.target.result;
                    previewImage.classList.add('active');
                };
                reader.readAsDataURL(file);
                
                detectBtn.disabled = false;
            } else {
                fileName.textContent = 'No file selected';
                previewImage.classList.remove('active');
                detectBtn.disabled = true;
            }
        });

        // Handle detect button click
        detectBtn.addEventListener('click', async () => {
            const file = imageInput.files[0];
            const names = objectNames.value.trim();
            const thresh = threshold.value;

            if (!file) {
                showError('Please select an image file');
                return;
            }

            if (!names) {
                showError('Please enter at least one object name to detect');
                return;
            }

            // Parse object names
            let parsedNames;
            try {
                parsedNames = JSON.parse(names);
                if (!Array.isArray(parsedNames)) {
                    parsedNames = [names];
                }
            } catch {
                // Treat as comma-separated
                parsedNames = names.split(',').map(n => n.trim()).filter(n => n);
            }

            // Hide previous results and messages
            errorMessage.classList.remove('active');
            successMessage.classList.remove('active');
            resultsSection.style.display = 'none';
            
            // Show loading
            loading.classList.add('active');
            detectBtn.disabled = true;

            try {
                const formData = new FormData();
                formData.append('file', file);
                formData.append('object_names', JSON.stringify(parsedNames));
                formData.append('threshold', thresh);

                const response = await fetch('/object-detection/detect', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (!data.success) {
                    throw new Error(data.message || 'Detection failed');
                }

                // Display results
                displayResults(data.data);
                showSuccess('Objects detected successfully!');
                resultsSection.style.display = 'grid';

            } catch (err) {
                showError(err.message || 'An error occurred during detection');
            } finally {
                loading.classList.remove('active');
                detectBtn.disabled = false;
            }
        });

        function displayResults(data) {
            // Display annotated image
            const annotatedImg = document.createElement('img');
            annotatedImg.src = `data:image/jpeg;base64,${data.annotated_image}`;
            annotatedImg.alt = 'Annotated Image';
            annotatedImageContainer.innerHTML = '';
            annotatedImageContainer.appendChild(annotatedImg);

            // Display detection stats
            detectionStats.innerHTML = '';
            
            const detections = data.detections;
            let hasDetections = false;

            for (const [objName, info] of Object.entries(detections)) {
                if (info.count > 0) {
                    hasDetections = true;
                }

                const statItem = document.createElement('div');
                statItem.className = 'stat-item';
                
                const boxesHtml = info.boxes.map((box, idx) => {
                    const [x1, y1, x2, y2, conf] = box;
                    return `<div class="box-coord">#${idx + 1}: [${x1.toFixed(1)}, ${y1.toFixed(1)}, ${x2.toFixed(1)}, ${y2.toFixed(1)}] conf: ${(conf * 100).toFixed(1)}%</div>`;
                }).join('');

                statItem.innerHTML = `
                    <div class="stat-header">
                        <span class="stat-name">${objName}</span>
                        <span class="stat-count ${info.count === 0 ? 'zero' : ''}">${info.count} found</span>
                    </div>
                    ${info.count > 0 ? `<div class="boxes-list">${boxesHtml}</div>` : ''}
                `;
                
                detectionStats.appendChild(statItem);
            }

            if (!hasDetections) {
                detectionStats.innerHTML = '<div class="stat-item"><p style="color: #888; text-align: center;">No objects detected. Try lowering the threshold or checking object names.</p></div>';
            }
        }

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.add('active');
            successMessage.classList.remove('active');
        }

        function showSuccess(message) {
            successMessage.textContent = message;
            successMessage.classList.add('active');
            errorMessage.classList.remove('active');
        }
    </script>
</body>
</html>
