
services:
  mongodb:
    image: mongo:7.0
    container_name: ai-features-mongodb
    restart: unless-stopped
    ports:
      - "3005:27017"
    environment:
      MONGO_INITDB_DATABASE: daraz
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: ai-features-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  setup-dummy-data:
    build: .
    container_name: ai-features-setup
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      - MONGO_URI=mongodb://mongodb:27017/
    command: >
      sh -c "python scripts/setup_dummy_data.py"
    restart: "no"

  app:
    build: .
    container_name: ai-features-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - MONGO_URI=mongodb://mongodb:27017/
      - REDIS_URI=redis://redis:6379/
    depends_on:
      redis:
        condition: service_healthy
      setup-dummy-data:
        condition: service_completed_successfully
    volumes:
      - models_data:/app/models

volumes:
  mongodb_data:
  models_data:
  redis_data: